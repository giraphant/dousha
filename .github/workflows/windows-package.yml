# Windows distributable for QUA-209: self-contained zip (exe + every DLL
# from the Swift runtime bin — that set includes vcruntime140/msvcp140 and
# was verified against a stripped PATH on real hardware).
#
# Runs when a GitHub Release is published (`make release` on the Mac side
# creates it) and attaches Dousha-Windows.zip to that release. Also
# runnable by hand (workflow_dispatch) — then the zip lands as a workflow
# artifact instead, for pre-release testing.
name: Windows package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Windows package (zip)
    runs-on: windows-latest
    steps:
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.3.2-release
          swift-build: 6.3.2-RELEASE
          cache: true
      - uses: actions/checkout@v4
      - name: Build (release)
        run: swift build -c release
      - name: Pack
        shell: pwsh
        run: |
          $dir = 'pkg/Dousha'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item .build/release/dousha-win.exe $dir
          # The runtime bin is the PATH entry that carries swiftCore.dll —
          # gha-setup-swift put it there so built exes can run.
          $runtime = ($env:Path -split ';') |
            Where-Object { $_ -and (Test-Path (Join-Path $_ 'swiftCore.dll')) } |
            Select-Object -First 1
          if (-not $runtime) { throw 'swiftCore.dll not found on PATH' }
          Copy-Item (Join-Path $runtime '*.dll') $dir
          Copy-Item 'Resources/Windows/使用说明.txt' $dir
          Compress-Archive -Path $dir -DestinationPath Dousha-Windows.zip
          $mb = [math]::Round((Get-Item Dousha-Windows.zip).Length / 1MB, 1)
          Write-Host "Dousha-Windows.zip: $mb MB, $((Get-ChildItem $dir).Count) files"
      - name: Smoke (self-contained — stripped PATH)
        shell: pwsh
        run: |
          $env:Path = 'C:\Windows\System32;C:\Windows'
          $out = & pkg/Dousha/dousha-win.exe --version
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "--version exited $LASTEXITCODE" }
      - name: Attach to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} Dousha-Windows.zip
      - name: Upload artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Dousha-Windows
          path: Dousha-Windows.zip
