# CI for QUA-209: the Windows dev box is usually powered off, so GitHub
# Actions is the always-on regression guard for the Windows port.
#
# - windows job: core modules + dousha-cli must keep building on Windows.
#   Package.swift drops the app/test targets on Windows automatically, and
#   there is no network smoke here — ws-probe/transcribe hit the real Doubao
#   servers and would register a throwaway device per run.
# - macos job: full build + 271-test suite guards the production side.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows build (core + CLI)
    runs-on: windows-latest
    steps:
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.3.2-release
          swift-build: 6.3.2-RELEASE
          cache: true
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: CLI smoke (usage exits 0, no network)
        run: .build\debug\dousha-cli.exe

  macos:
    name: macOS build + tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
