# macOS build + full test suite. No network smoke here: ws-probe/transcribe
# hit the real Doubao servers and would register a throwaway device per run.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS build + tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
